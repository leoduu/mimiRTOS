<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <text x="350" y="36" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">线程管理 · 调度流程</text>

  <!-- ================= 第一层：左对齐，右边界统一到 670 ================= -->
  <rect x="30" y="62" width="280" height="94" rx="6" fill="#ffffff" stroke="#95a5a6"/>
  <path d="M30,68 a6,6 0 0 1 6,-6 h268 a6,6 0 0 1 6,6 v20 h-280 z" fill="#34495e"/>
  <text x="44" y="80" font-size="12.5" font-weight="bold" fill="#ffffff">线程管理接口</text>
  <g font-size="11" fill="#333333">
    <text x="44" y="110">阻塞挂起：delay() · suspend()</text>
    <text x="44" y="128">唤醒就绪：resume()</text>
    <text x="44" y="146">终止回收：kill()</text>
  </g>

  <rect x="340" y="62" width="150" height="94" rx="6" fill="#ffffff" stroke="#95a5a6"/>
  <path d="M340,68 a6,6 0 0 1 6,-6 h138 a6,6 0 0 1 6,6 v20 h-150 z" fill="#7f8c8d"/>
  <text x="354" y="80" font-size="12.5" font-weight="bold" fill="#ffffff">主动让出</text>
  <text x="415" y="126" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-family="Consolas, Menlo, monospace">yield()</text>

  <rect x="520" y="62" width="150" height="94" rx="6" fill="#ffffff" stroke="#95a5a6"/>
  <path d="M520,68 a6,6 0 0 1 6,-6 h138 a6,6 0 0 1 6,6 v20 h-150 z" fill="#7f8c8d"/>
  <text x="534" y="80" font-size="12.5" font-weight="bold" fill="#ffffff">SysTick 心跳</text>
  <g font-size="11" fill="#333333">
    <text x="534" y="125">mimi_sys_tick_handler()</text>
  </g>

  <!-- ================= 第二层 ================= -->
  <rect x="30" y="204" width="280" height="66" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.5"/>
  <path d="M30,210 a6,6 0 0 1 6,-6 h268 a6,6 0 0 1 6,6 v20 h-280 z" fill="#16a085"/>
  <text x="44" y="222" font-size="12.5" font-weight="bold" fill="#ffffff">抢占式调度</text>
  <text x="170" y="253" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-family="Consolas, Menlo, monospace">mimi_schedule()</text>

  <rect x="340" y="204" width="330" height="66" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.5"/>
  <path d="M340,210 a6,6 0 0 1 6,-6 h318 a6,6 0 0 1 6,6 v20 h-330 z" fill="#16a085"/>
  <text x="354" y="222" font-size="12.5" font-weight="bold" fill="#ffffff">时间片轮转</text>
  <text x="505" y="253" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-family="Consolas, Menlo, monospace">mimi_schedule_rr()</text>

  <!-- ================= 第三层 ================= -->
  <rect x="30" y="318" width="640" height="66" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <path d="M30,324 a6,6 0 0 1 6,-6 h628 a6,6 0 0 1 6,6 v20 h-640 z" fill="#2980b9"/>
  <text x="44" y="336" font-size="12.5" font-weight="bold" fill="#ffffff">上下文切换</text>
  <text x="350" y="367" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-family="Consolas, Menlo, monospace">mimi_context_switch()  →  PendSV_Handler</text>

  <!-- ================= 箭头 ================= -->
  <g stroke="#7f8c8d" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="170" y1="156" x2="170" y2="200"/>
    <line x1="415" y1="156" x2="415" y2="200"/>
    <line x1="595" y1="156" x2="595" y2="200"/>
    <line x1="338" y1="240" x2="312" y2="240"/>
    <line x1="170" y1="270" x2="170" y2="314"/>
  </g>

</svg>
