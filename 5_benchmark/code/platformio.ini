; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
bsp_dir = bsp/nucleo-l452
bsp_env = nucleo_l452re

[platformio]
src_dir = .
include_dir = .
default_envs = ${common.bsp_env}
extra_configs =
    ${common.bsp_dir}/platformio.ini
    # Thread-Metric benchmark suite
    benchmark/thread-metric-benchmark/platformio.ini
    # RTOSBench suite
    benchmark/rtosbench/platformio.ini

# unit test
# run in platformIO terminal: pio test -e unit
[env:unit]
platform = native
test_filter = test/unit/*
test_build_src = yes
build_flags =
    -Itest
    -Ikernel/include
    -Ikernel/utils
    -DMIMI_DEBUG_ASSERT=1
build_src_filter =
    +<test/unit/*>
    +<kernel/utils/list.c>
    +<kernel/utils/ringbuffer.c>
    +<kernel/src/timer.c>
    +<kernel/src/ipc.c>
