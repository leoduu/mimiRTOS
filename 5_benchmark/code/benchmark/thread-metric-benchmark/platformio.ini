# Thread-Metric benchmark suite (8 tests, one env each)

[tm_common]
extends = bsp_ini
build_unflags = -Os
build_flags =
    -O2
    ${bsp_ini.build_flags}
    -Ibenchmark/thread-metric-benchmark/include
    -Ibenchmark/thread-metric-benchmark/ports/mimiOS
    -DTM_TEST_DURATION=5
build_src_filter =
    ${bsp_ini.build_src_filter}
    -<example/*>
    +<benchmark/thread-metric-benchmark/ports/mimiOS/*>
    +<benchmark/thread-metric-benchmark/src/tm_report.c>

# pio run -e tm_basic -t upload
[env:tm_basic]
extends = tm_common
build_src_filter =
    ${tm_common.build_src_filter}
    +<benchmark/thread-metric-benchmark/src/basic_processing.c>

# pio run -e tm_coop -t upload
[env:tm_coop]
extends = tm_common
build_src_filter =
    ${tm_common.build_src_filter}
    +<benchmark/thread-metric-benchmark/src/cooperative_scheduling.c>

# pio run -e tm_preempt -t upload
