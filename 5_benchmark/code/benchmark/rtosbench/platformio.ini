# RTOSBench
#
# Build:    pio run -e rtb_round_robin -t upload
# Watch:    pio device monitor -e rtb_round_robin

# ---------------------------------------------------------------------------
#  mimiOS
# ---------------------------------------------------------------------------
[rtb_mimimi_common]
extends = bsp_ini
build_unflags = -Os
build_flags =
    -O2
    ${bsp_ini.build_flags}
    -Ibenchmark/rtosbench/include
    -Ibenchmark/rtosbench/ports/mimiOS
build_src_filter =
    ${bsp_ini.build_src_filter}
    -<example/*>
    +<benchmark/rtosbench/ports/mimiOS/*>

# --- context-switch --------------------------------------------------------
# pio run -e rtb_round_robin -t upload
[env:rtb_round_robin]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=1000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/context-switch/round_robin.c>

# pio run -e rtb_preempt -t upload
[env:rtb_preempt]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=5000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/context-switch/preempt.c>

# --- interrupt -------------------------------------------------------------
# pio run -e rtb_preempt -t upload
[env:rtb_interrupt]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=12000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/interrupt/interrupt_processing.c>

# --- message queue ---------------------------------------------------------
# pio run -e rtb_preempt -t upload
[env:rtb_mq]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=100000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/mq/mq.c>

# pio run -e rtb_preempt -t upload
[env:rtb_mq_processing]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=100000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/mq/mq_processing.c>

# pio run -e rtb_preempt -t upload
[env:rtb_mq_workload]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=7000
    -DNB_WORKLOAD_TASK=0
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/mq/mq_workload.c>

# --- mutex -----------------------------------------------------------------
# pio run -e rtb_preempt -t upload
