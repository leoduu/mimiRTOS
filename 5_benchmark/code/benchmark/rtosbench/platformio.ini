extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
    -DNB_ITER=100000
build_src_filter =
    ${rtb_mimimi_common.build_src_filter}
    +<benchmark/rtosbench/tests/mutex/mutex_processing.c>

# pio run -e rtb_preempt -t upload
[env:rtb_mutex_workload]
extends = rtb_mimimi_common
build_flags = ${rtb_mimimi_common.build_flags}
