; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .
default_envs = nucleo_l452re

[env:nucleo_l452re]
platform = ststm32
board = nucleo_l452re
framework = stm32cube
board_build.ldscript = bsp/nucleo-l452/STM32L452XX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM3
debug_build_flags = -g
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.110301.0
    framework-stm32cubel4@~1.17.0
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32L452xx
    -Ilibcpu
    -Ikernel/utils
    -Ikernel/include
    -Ibsp/
    -Ibsp/nucleo-l452/Core/Inc
build_src_filter =
    +<kernel/*>
    +<kernel/utils/*>
    +<libcpu/cortex-m/*>
    +<bsp/nucleo-l452/Core/*>
    +<bsp/nucleo-l452/*>
    +<app/*>
    -<bsp/nucleo-l452/Core/Src/stm32l4xx_it.c>
board_build.framework_files =
    -<**/startup_*.s>

# unit test
# cli: pio test -e unit
[env:unit]
platform = native
test_build_src = yes
build_flags =
    -Itest
    -Ikernel/include
    -Ikernel/utils
    -Ilibcpu
build_src_filter =
    +<test/unit/*>
    +<kernel/utils/list.c>
