<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 复位椭圆 -->
  <ellipse cx="80" cy="125" rx="50" ry="25" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="80" y="130" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#000000">复位</text>

  <!-- 箭头：复位 → 第一个方框 -->
  <path d="M 130 125 L 170 125" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 第一个方框：取MSP的初始值 -->
  <rect x="170" y="100" width="110" height="50" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="225" y="118" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">取MSP的</text>
  <text x="225" y="138" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">初始值</text>

  <!-- 上方文字：读地址 0x00000000 -->
  <text x="225" y="75" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">读地址</text>
  <text x="225" y="92" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">0x00000000</text>

  <!-- 箭头：第一个方框 → 第二个方框 -->
  <path d="M 280 125 L 320 125" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 第二个方框：取复位向量 -->
  <rect x="320" y="100" width="110" height="50" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="375" y="130" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">取复位向量</text>

  <!-- 上方文字：读地址 0x00000004 -->
  <text x="375" y="75" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">读地址</text>
  <text x="375" y="92" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">0x00000004</text>

  <!-- 箭头：第二个方框 → 第三个方框 -->
  <path d="M 430 125 L 470 125" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 第三个方框：取第一条指令 -->
  <rect x="470" y="100" width="110" height="50" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="525" y="130" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">取第一条指令</text>

  <!-- 上方文字：读取复位向量表示的地址（分两行） -->
  <text x="525" y="70" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">读取复位向量</text>
  <text x="525" y="87" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">表示的地址</text>

  <!-- 箭头：第三个方框 → 虚线框 -->
  <path d="M 580 125 L 620 125" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 虚线框：接下来的取值 -->
  <rect x="620" y="100" width="90" height="50" rx="3" ry="3" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" />

  <!-- 上方文字：接下来的取值 -->
  <text x="665" y="80" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">接下来的取值</text>

</svg>