<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="140" y="38" font-size="17" font-weight="bold" fill="#222222">优先级翻转：高优先级 A 被低优先级 C 拖住</text>

  <!-- 行标签 -->
  <text x="8" y="94" font-size="13" fill="#222222">A（高优先级）</text>
  <text x="8" y="164" font-size="13" fill="#222222">B（中优先级）</text>
  <text x="8" y="234" font-size="13" fill="#222222">C（低优先级）</text>

  <!-- 阶段分隔虚线 -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3">
    <line x1="240" y1="52" x2="240" y2="260"/>
    <line x1="440" y1="52" x2="440" y2="260"/>
    <line x1="540" y1="52" x2="540" y2="260"/>
  </g>

  <!-- A：等锁 [240,540]，运行 [540,640] -->
  <rect x="240" y="72" width="300" height="40" rx="3" fill="#f0f0f0" stroke="#dddddd"/>
  <text x="250" y="97" font-size="12" fill="#666666">等 C 释放锁</text>
  <rect x="540" y="72" width="100" height="40" rx="3" fill="#e74c3c"/>
  <text x="565" y="97" font-size="12" fill="#ffffff">运行</text>

  <!-- B：抢占 [240,440] -->
  <rect x="240" y="142" width="200" height="40" rx="3" fill="#f39c12"/>
  <text x="290" y="167" font-size="12" fill="#ffffff">B 抢占 C</text>

  <!-- C：持锁运行 [140,240]，被抢占 [240,440]，释放锁 [440,540] -->
  <rect x="140" y="212" width="100" height="40" rx="3" fill="#3498db"/>
  <text x="160" y="237" font-size="12" fill="#ffffff">持锁运行</text>
  <rect x="240" y="212" width="200" height="40" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-dasharray="4,3"/>
  <text x="265" y="237" font-size="12" fill="#999999">被抢占，拿不到 CPU</text>
  <rect x="440" y="212" width="100" height="40" rx="3" fill="#3498db"/>
  <text x="460" y="237" font-size="12" fill="#ffffff">释放锁</text>

  <!-- 问题说明 -->
  <text x="140" y="300" font-size="13" fill="#e74c3c">问题：A 是最高优先级，却要等最低优先级的 C；C 又被中间的 B 抢占，锁一直压在 C 手里。</text>

  <!-- 时间轴刻度 -->
  <g stroke="#333333" stroke-width="1">
    <line x1="140" y1="380" x2="140" y2="388"/>
    <line x1="240" y1="380" x2="240" y2="388"/>
    <line x1="340" y1="380" x2="340" y2="388"/>
    <line x1="440" y1="380" x2="440" y2="388"/>
    <line x1="540" y1="380" x2="540" y2="388"/>
    <line x1="640" y1="380" x2="640" y2="388"/>
  </g>
  <g font-size="11" fill="#333333" text-anchor="middle">
    <text x="140" y="403">C 持锁</text>
    <text x="240" y="403">B 抢占</text>
    <text x="340" y="403">C 被卡</text>
    <text x="440" y="403">C 释放</text>
    <text x="540" y="403">A 运行</text>
    <text x="640" y="403">t</text>
  </g>

  <!-- 图例 -->
  <g font-size="12" fill="#333333">
    <rect x="420" y="414" width="14" height="14" rx="2" fill="#e74c3c"/>
    <text x="440" y="426">A（高）</text>
    <rect x="500" y="414" width="14" height="14" rx="2" fill="#f39c12"/>
    <text x="520" y="426">B（中）</text>
    <rect x="580" y="414" width="14" height="14" rx="2" fill="#3498db"/>
    <text x="600" y="426">C（低）</text>
    <rect x="660" y="414" width="14" height="14" rx="2" fill="#f0f0f0" stroke="#dddddd"/>
    <text x="680" y="426">阻塞</text>
  </g>
</svg>
