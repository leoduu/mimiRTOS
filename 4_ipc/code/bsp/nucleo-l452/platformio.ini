
[env:nucleo_l452re]
platform = ststm32
board = nucleo_l452re
framework = stm32cube
board_build.ldscript = bsp/nucleo-l452/STM32L452XX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM3
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.110301.0
    framework-stm32cubel4@~1.17.0
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32L452xx
    -Ilibcpu
    -Ikernel/utils
    -Ikernel/include
    -Ibsp/
    -Ibsp/nucleo-l452/Core/Inc
build_src_filter =
    +<kernel/*>
    +<kernel/utils/*>
    +<libcpu/cortex-m/*>
    +<app/*>
    +<bsp/nucleo-l452/Core/*>
    +<bsp/nucleo-l452/*>
    -<bsp/nucleo-l452/Core/Src/stm32l4xx_it.c>
board_build.framework_files =
    -<**/startup_*.s>
