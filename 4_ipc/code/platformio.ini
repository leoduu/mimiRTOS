; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .
default_envs = nucleo_l452re
; default_envs = tm_coop

[common]
debug_build_flags = -g

# unit test
# cli: pio test -e unit
[env:unit]
platform = native
test_filter = test/unit/*
test_build_src = yes
build_flags =
    -Itest
    -Ikernel/include
    -Ikernel/utils
    -Ilibcpu
build_src_filter =
    +<test/unit/*>
    +<kernel/utils/list.c>
    +<kernel/utils/ringbuffer.c>
    +<kernel/src/timer.c>
    +<kernel/src/ipc.c>

[env:nucleo_l452re]
platform = ststm32
board = nucleo_l452re
framework = stm32cube
board_build.ldscript = bsp/nucleo-l452/STM32L452XX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM3
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.110301.0
    framework-stm32cubel4@~1.17.0
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32L452xx
    -Ilibcpu
    -Ikernel/utils
    -Ikernel/include
    -Ibsp/
    -Ibsp/nucleo-l452/Core/Inc
build_src_filter =
    +<kernel/*>
    +<kernel/utils/*>
    +<libcpu/cortex-m/*>
    +<example/*>
    +<bsp/nucleo-l452/Core/*>
    +<bsp/nucleo-l452/*>
    -<bsp/nucleo-l452/Core/Src/stm32l4xx_it.c>
board_build.framework_files =
    -<**/startup_*.s>

# Thread-Metric benchmark suite
# Run with: pio run -e tm_coop -t upload
# Change TM_TEST_FILE in build_src_filter to switch tests
[env:tm_coop]
platform = ststm32
board = nucleo_l452re
framework = stm32cube
board_build.ldscript = bsp/nucleo-l452/STM32L452XX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM3
platform_packages =
    platformio/toolchain-gccarmnoneeabi@^1.110301.0
    framework-stm32cubel4@~1.17.0
build_flags =
    -Os
    -DUSE_HAL_DRIVER
    -DSTM32L452xx
    -DTM_TEST_DURATION=5
    -DTHREAD_METRIC_APP
    -Ilibcpu
    -Ikernel/utils
    -Ikernel/include
    -Ibsp/
    -Ibsp/nucleo-l452/Core/Inc
    -Ithread-metric-benchmark/include
    -Ithread-metric-benchmark/ports/mimimi
build_src_filter =
    +<kernel/*>
    +<kernel/utils/*>
    +<libcpu/cortex-m/*>
    +<bsp/nucleo-l452/Core/*>
    +<bsp/nucleo-l452/*>
    -<bsp/nucleo-l452/Core/Src/stm32l4xx_it.c>
    ; Thread-Metric core (report + one test)
    +<thread-metric-benchmark/src/tm_report.c>
    ; +<thread-metric-benchmark/src/basic_processing.c>
    +<thread-metric-benchmark/src/cooperative_scheduling.c>
    ; +<thread-metric-benchmark/src/preemptive_scheduling.c>
    ; +<thread-metric-benchmark/src/memory_allocation.c>
    ; +<thread-metric-benchmark/src/message_processing.c>
    ; +<thread-metric-benchmark/src/synchronization_processing.c>
    ; +<thread-metric-benchmark/src/interrupt_processing.c>
    ; +<thread-metric-benchmark/src/interrupt_preemption_processing.c>
    ; mimimi_os port
    +<thread-metric-benchmark/ports/mimimi/*>
    ; exclude mimimi_os example apps
    ; -<example/*>
board_build.framework_files =
    -<**/startup_*.s>

# Additional Thread-Metric tests (copy from tm_coop, change the test file):
# [env:tm_preempt] → src/preemptive_scheduling.c
# [env:tm_basic]   → src/basic_processing.c
# [env:tm_sync]    → src/synchronization_processing.c
# [env:tm_msg]     → src/message_processing.c
# [env:tm_mem]     → src/memory_allocation.c
# [env:tm_intr]    → src/interrupt_processing.c
# [env:tm_intp]    → src/interrupt_preemption_processing.c
